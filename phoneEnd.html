<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Vita Remote</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1c1d20;
    color: #f2efe9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  #status {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    padding: 14px 16px 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0));
    z-index: 5;
  }

  #status.connected { color: #8fd19e; }
  #status.error { color: #e08a7d; }

  .joystick-zone {
    position: fixed;
    left: 26px;
    bottom: env(safe-area-inset-bottom, 26px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    width: 150px;
    height: 150px;
  }

  .joystick-base {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
  }

  .joystick-knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 64px;
    height: 64px;
    margin-left: -32px;
    margin-top: -32px;
    border-radius: 50%;
    background: #a55b3d;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    transition: transform 0.05s linear;
  }

  .joystick-knob.dragging {
    transition: none;
  }

  .action-buttons {
    position: fixed;
    right: 22px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .action-btn {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.08);
    color: #f2efe9;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .action-btn:active {
    background: rgba(255,255,255,0.18);
  }

  .action-btn.on {
    border-color: rgba(165,91,61,0.7);
    color: #d8895f;
  }

  #missingPeer {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 30px;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div id="status">Starting…</div>
  <div class="joystick-zone" id="joyZone">
    <div class="joystick-base"></div>
    <div class="joystick-knob" id="joyKnob"></div>
  </div>
  <div class="action-buttons">
    <button class="action-btn" id="jumpBtn">Jump</button>
    <button class="action-btn" id="crouchBtn">Crouch</button>
    <button class="action-btn" id="autoSitBtn">Sit</button>
  </div>
  <div id="missingPeer">
    This page controls Vita in "My Office."<br />
    Open it by scanning the QR code shown on the desktop scene's
    "Phone Control" panel — it links here with the right connection info.
  </div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
  const statusEl = document.getElementById("status");
  const joyZone = document.getElementById("joyZone");
  const joyKnob = document.getElementById("joyKnob");
  const jumpBtn = document.getElementById("jumpBtn");
  const crouchBtn = document.getElementById("crouchBtn");
  const autoSitBtn = document.getElementById("autoSitBtn");
  const missingPeer = document.getElementById("missingPeer");

  const params = new URLSearchParams(window.location.search);
  const targetPeerId = params.get("peer");

  if (!targetPeerId) {
    document.querySelector(".joystick-zone").style.display = "none";
    document.querySelector(".action-buttons").style.display = "none";
    statusEl.style.display = "none";
    missingPeer.style.display = "flex";
  } else {
    const peer = new Peer();
    let conn = null;

    function send(data) {
      if (conn && conn.open) conn.send(data);
    }

    peer.on("open", () => {
      statusEl.textContent = "Connecting to My Office…";
      conn = peer.connect(targetPeerId, { reliable: false });
      conn.on("open", () => {
        statusEl.textContent = "Connected — you're driving Vita";
        statusEl.className = "connected";
      });
      conn.on("close", () => {
        statusEl.textContent = "Disconnected";
        statusEl.className = "error";
      });
      conn.on("error", () => {
        statusEl.textContent = "Connection error";
        statusEl.className = "error";
      });
    });
    peer.on("error", (err) => {
      statusEl.textContent = "Error: " + err.type;
      statusEl.className = "error";
    });

    const JOY_MAX = 55;
    let joyPointerId = null;

    function updateJoyFromClient(clientX, clientY) {
      const rect = joyZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      const clamped = Math.min(dist, JOY_MAX);
      const angle = Math.atan2(dy, dx);
      const kx = Math.cos(angle) * clamped;
      const ky = Math.sin(angle) * clamped;
      joyKnob.style.transform = `translate(${kx}px, ${ky}px)`;
      send({ type: "joy", x: kx / JOY_MAX, y: ky / JOY_MAX });
    }

    function endJoy() {
      joyPointerId = null;
      joyKnob.style.transform = "translate(0px, 0px)";
      joyKnob.classList.remove("dragging");
      send({ type: "joy", x: 0, y: 0 });
    }

    joyZone.addEventListener("pointerdown", (event) => {
      joyPointerId = event.pointerId;
      joyZone.setPointerCapture(event.pointerId);
      joyKnob.classList.add("dragging");
      updateJoyFromClient(event.clientX, event.clientY);
      event.preventDefault();
    });
    joyZone.addEventListener("pointermove", (event) => {
      if (joyPointerId !== event.pointerId) return;
      updateJoyFromClient(event.clientX, event.clientY);
      event.preventDefault();
    });
    joyZone.addEventListener("pointerup", (event) => {
      if (joyPointerId !== event.pointerId) return;
      endJoy();
    });
    joyZone.addEventListener("pointercancel", () => endJoy());

    jumpBtn.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      send({ type: "jump" });
    });
    crouchBtn.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      crouchBtn.classList.toggle("on");
      send({ type: "crouch" });
    });
    autoSitBtn.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      send({ type: "autosit" });
    });
  }
</script>
</body>
</html>
